name: macOS arm64 build

on:
  push:
    branches: [ apple-silicon, master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout (with JUCE 3.0.0 submodule)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          brew update >/dev/null || true
          brew install fftw libomp

      - name: Fetch Eigen 3.2 headers
        run: |
          set -euo pipefail
          EIGEN_VER=3.2.10
          curl -fsSL -o eigen.tar.gz "https://gitlab.com/libeigen/eigen/-/archive/${EIGEN_VER}/eigen-${EIGEN_VER}.tar.gz"
          mkdir -p sdks/eigen
          tar -xzf eigen.tar.gz --strip-components=1 -C sdks/eigen
          test -f sdks/eigen/Eigen/Core

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DISSE_USE_OPENMP=ON 2>&1 | tee configure.log
          echo "::notice title=configure::$(grep -E 'FFTW|OpenMP|libomp|JUCE patch' configure.log | awk 'BEGIN{ORS="%0A"} {print}')"

      - name: Build
        run: |
          set +e
          cmake --build build -j "$(sysctl -n hw.ncpu)" > build.log 2>&1
          rc=$?
          set -e
          echo "::notice title=warnings::$(grep -c 'warning:' build.log) compiler warnings"
          if [ $rc -ne 0 ]; then
            # Annotations are capped at 10 errors per step, so join lines with %0A.
            enc() { sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}'; }
            echo "::error title=failed-units::$(grep -E '\.o\] Error' build.log | sed 's#.*CMakeFiles/ISSE.dir/##' | sort -u | head -30 | enc)"
            n=$(grep -n -m1 "error:" build.log | cut -d: -f1)
            if [ -n "$n" ]; then
              s=$(( n > 30 ? n - 30 : 1 ))
              echo "::error title=first-error-context::$(sed -n "${s},$((n + 6))p" build.log | grep -vE '^\s*$' | cut -c1-400 | enc)"
            fi
            echo "::error title=unique-errors::$(grep -E 'error:' build.log | sed 's#^/Users/runner/work/ISSE/ISSE/##; s#^/Applications/Xcode[^/]*/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/#SDK/#' | sort | uniq -c | sort -rn | head -60 | cut -c1-300 | enc)"
            exit $rc
          fi

      - name: Bundle non-system libraries and sign
        run: |
          set -euo pipefail
          APP=build/ISSE.app
          BIN="$APP/Contents/MacOS/ISSE"
          FW="$APP/Contents/Frameworks"
          echo "::notice title=binary::$(file "$BIN" | sed 's/.*: //') | archs=$(lipo -archs "$BIN")"
          # Copy any Homebrew dylibs (e.g. libomp) into the bundle and rewrite load paths
          mkdir -p "$FW"
          for lib in $(otool -L "$BIN" | tail -n +2 | awk '{print $1}' | grep -E "^(/opt/homebrew|/usr/local)/" || true); do
            name=$(basename "$lib")
            cp -fL "$lib" "$FW/$name"
            chmod 755 "$FW/$name"
            install_name_tool -id "@executable_path/../Frameworks/$name" "$FW/$name"
            install_name_tool -change "$lib" "@executable_path/../Frameworks/$name" "$BIN"
            echo "::notice title=bundled::$lib"
          done
          rmdir "$FW" 2>/dev/null || true
          otool -L "$BIN" | tail -n +2 | awk '{print $1}' | tr '\n' ' ' | sed 's/^/::notice title=linked::/'; echo
          if otool -L "$BIN" | tail -n +2 | grep -qE "/opt/homebrew|/usr/local"; then
            echo "::error title=bundle::non-system dylib still linked"; exit 1
          fi
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"
          echo "::notice title=app-size::$(du -sh "$APP" | cut -f1)"
          ditto -c -k --keepParent "$APP" ISSE-macos-arm64.zip

      - name: Smoke test (launch for a few seconds)
        run: |
          set +e
          build/ISSE.app/Contents/MacOS/ISSE > launch.log 2>&1 &
          pid=$!
          sleep 8
          if kill -0 $pid 2>/dev/null; then
            echo "::notice title=launch::ISSE still running after 8s (no crash on startup)"
            kill $pid
          else
            wait $pid; rc=$?
            echo "::warning title=launch::ISSE exited early with code $rc"
            enc() { sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}'; }
            echo "::warning title=launch-log::$(head -40 launch.log | cut -c1-300 | enc)"
            # Re-run under lldb to capture the crashing backtrace
            lldb --batch -o "process launch" -k "thread backtrace all" -k "register read pc lr sp" -k "quit" \
              -- build/ISSE.app/Contents/MacOS/ISSE > lldb.log 2>&1 || true
            echo "::warning title=lldb-crash::$(grep -nE 'stop reason|EXC_|signal' lldb.log | head -5 | cut -c1-300 | enc)"
            # Crashed thread first, then the rest (frames trimmed)
            echo "::warning title=lldb-bt::$(awk '/stop reason/{p=1} p' lldb.log | grep -E '^\* thread|^  thread|frame #' | head -60 | cut -c1-260 | enc)"
          fi
          exit 0

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ISSE-macos-arm64
          path: ISSE-macos-arm64.zip

      - name: Publish prerelease (apple-silicon-latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/apple-silicon'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=apple-silicon-latest
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" ISSE-macos-arm64.zip \
            --prerelease --target "${{ github.sha }}" \
            --title "ISSE arm64 (latest apple-silicon build)" \
            --notes "Ad-hoc signed, not notarized. Built from ${{ github.sha }}. If downloaded with a browser, run: xattr -dr com.apple.quarantine ISSE.app"
          echo "::notice title=release::https://github.com/${{ github.repository }}/releases/download/$TAG/ISSE-macos-arm64.zip"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            configure.log
            launch.log
            lldb.log
          if-no-files-found: ignore
